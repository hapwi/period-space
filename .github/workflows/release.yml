name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate version tag
        run: |
          version="$(./period-space --version | awk '{print $2}')"
          if [[ "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match CLI version v${version}" >&2
            exit 1
          fi

      - name: Validate scripts
        run: |
          bash -n install.sh
          python3 -m py_compile period-space

      - name: Build release assets
        run: |
          mkdir -p dist
          cp period-space keyd.conf install.sh dist/
          cd dist
          sha256sum period-space keyd.conf install.sh > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/period-space \
            dist/keyd.conf \
            dist/install.sh \
            dist/SHA256SUMS \
            --title "period-space ${GITHUB_REF_NAME}" \
            --generate-notes
