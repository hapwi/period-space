  <text x="64" y="72" fill="#c8bfb0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" letter-spacing="0.18em">PERIOD-SPACE</text>
  <text x="64" y="132" fill="#f4efe6" font-family="ui-serif, Iowan Old Style, Palatino, Georgia, serif" font-size="44">hello</text>
  <g transform="translate(196,96)">
    <rect x="0" y="0" width="86" height="44" rx="7" fill="#2a2622" stroke="#6d6458"/>
