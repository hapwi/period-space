# macOS-style "add period with double-space"
#
# First Space is a Space. A second Space within 400ms becomes ". "
# (backspace the first space, then period, then space).
# keyd remaps at the device level, so this works in Wayland, terminals, and a TTY.
#
# How this file is used:
#   [ids]            -> /etc/keyd/period-space.conf, only when no other keyd
#                       config already claims all keyboards
#   everything else  -> /etc/keyd/period-space.inc, included by every keyd
#                       config that owns a keyboard
# Edit here, then run `period-space reload`.
#
# Panic if the keyboard dies: hold Backspace + Escape + Enter to kill keyd.
#
# If a mouse or gamepad starts acting like a keyboard, exclude it:
#   keyd monitor
# then add a line under [ids] like:
#   -1234:5678

[ids]
*

[global]
oneshot_timeout = 400

[main]
space = oneshotm(afterspace, space)

[afterspace]
space = macro(backspace . space)

# Keep shortcuts that use Space as a modifier chord.
[control]
space = C-space

[alt]
space = A-space

[meta]
space = M-space

[altgr]
space = G-space
